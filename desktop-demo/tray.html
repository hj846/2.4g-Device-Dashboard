<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS · 设备电量</title>
<style>
@font-face{font-family:Harmony;src:url(assets/fonts/HarmonyOS_Sans_SC_Regular.ttf)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:#eee;font:13px Harmony,"Microsoft YaHei",sans-serif}main{height:100%;border:1px solid #ffffff28;border-radius:20px;background:#090a0bf5;overflow:hidden;display:flex;flex-direction:column}.devices{padding:14px 14px 10px;overflow-y:auto;scrollbar-width:thin;flex:1;min-height:0}.device{display:flex;align-items:center;gap:10px;min-height:40px;margin-bottom:8px;padding:10px 12px;background:#ffffff0d;border-radius:14px}.device:last-child{margin-bottom:0}.kind{width:18px;height:18px;flex:none;color:#c6c7c9}.kind svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.power{display:flex;align-items:center;gap:7px;flex-shrink:0;color:#d8d9da;font-size:12px}.battery{width:10px;height:17px;border:1px solid currentColor;border-radius:3px;padding:2px;position:relative;display:flex;align-items:flex-end}.battery:before{content:"";position:absolute;top:-3px;left:2px;width:4px;height:2px;border-radius:1px;background:currentColor}.battery i{width:100%;height:var(--level);background:currentColor;border-radius:1px}.low{color:#efb56e}.charging{color:#9cdbba}.empty{color:#999;text-align:center;padding:10px 0;font-size:12px}footer{display:grid;grid-template-columns:1fr 1fr;flex:none;border-top:1px solid #ffffff12;height:44px;align-items:center}button{font:inherit;font-weight:600;color:inherit;background:transparent;border:0;cursor:pointer;height:100%}button:hover{background:#ffffff0c}button:focus-visible{outline:1px solid #99c9b2;outline-offset:-4px}#quit{position:relative}#quit:before{content:"";position:absolute;left:0;top:14px;height:16px;width:1px;background:#ffffff20}
</style><main><div class="devices" id="devices" aria-live="polite"></div><footer><button id="open">打开 NEXUS</button><button id="quit">退出</button></footer></main><script src="tray-renderer.js"></script></html>
