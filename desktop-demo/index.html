<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS · 设备总览</title>
<style>
@font-face{font-family:Harmony;src:url(assets/fonts/HarmonyOS_Sans_SC_Regular.ttf)}*{box-sizing:border-box}body{margin:0;color:#202b29;font-family:Harmony,"Microsoft YaHei",sans-serif;background:#edf3f2;--a:#a9e8c9;--b:#a0ded9;--accent:#16b86e}
body[data-theme=purple]{--a:#cdb8ec;--b:#b6c6ea;--accent:#8662ba}body[data-theme=night]{--a:#87b8a5;--b:#99c9c6;--accent:#317860}
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden}.ambient:before,.ambient:after{content:"";position:absolute;width:80vw;height:65vh;bottom:-32vh;border-radius:50%;filter:blur(80px);background:var(--a);animation:drift 15s ease-in-out infinite alternate}.ambient:after{right:-15%;bottom:-25vh;background:var(--b);animation-delay:-8s;animation-duration:19s}
@keyframes drift{to{transform:translate(20vw,-14vh) scale(1.12)}}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
.app{height:100dvh;min-height:620px;max-width:1700px;margin:auto;padding:24px 4vw 20px;display:flex;flex-direction:column;gap:14px}.top{-webkit-app-region:drag;padding-right:140px;display:flex;align-items:center;justify-content:space-between}.wordmark{font-size:23px;letter-spacing:.06em;font-weight:900}.tools{-webkit-app-region:no-drag;display:flex;align-items:center;gap:22px}.tools small{font-size:11px;color:#6e8079}.gear{border:0;background:none;font-size:26px;padding:4px 10px}
.heading{position:relative;display:flex;justify-content:space-between;align-items:flex-end;padding-top:30px;min-height:116px}.heading:before{content:"DEVICE OVERVIEW";position:absolute;top:0;left:0;white-space:nowrap;font:900 clamp(48px,6.3vw,96px)/1 Arial;letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1px #54796a30;z-index:-1}h1{font-size:clamp(32px,4vw,58px);margin:0;letter-spacing:-.04em}.filters{display:flex;border:1px solid #fff;background:#ffffff40;border-radius:24px;padding:4px}.filters button{border:0;border-radius:20px;background:none;padding:12px 24px;font-size:15px}.filters button[aria-pressed=true]{background:#ffffff9e;box-shadow:0 4px 16px #366c5215;color:var(--accent)}
.hero{flex:1;min-height:0;display:grid;grid-template-columns:56% 44%;align-items:center;padding:0 3vw}.info{animation:appear .35s ease}.identity{display:flex;align-items:flex-start;gap:24px}.brand-logo{width:75px;height:75px;object-fit:contain;mix-blend-mode:multiply}.brand{font-size:17px;letter-spacing:.18em;margin:0 0 9px}h2{font-size:clamp(28px,3.5vw,51px);line-height:1.13;letter-spacing:-.045em;margin:0;max-width:490px;overflow-wrap:anywhere}.kind{color:#66736d;font-size:17px;margin:14px 0}.status{font-size:19px;display:flex;align-items:center;gap:10px}.dot{width:11px;height:11px;border-radius:50%;background:var(--accent)}.offline .dot{background:#a6ada9}
.metrics{display:flex;margin-top:36px;gap:25px}.metric{padding-right:25px;border-right:1px solid #6a887b26}.metric:last-child{border:0;padding-right:0}.metric small{display:block;color:#66766f;font-size:14px;margin-bottom:12px}.metric strong{font-size:clamp(18px,2vw,27px);white-space:nowrap}.battery{display:inline-block;width:33px;height:17px;border:1.7px solid var(--accent);border-radius:4px;position:relative;margin-right:10px;vertical-align:0;padding:2px}.battery:after{content:"";position:absolute;width:3px;height:7px;right:-5px;top:3px;background:var(--accent);border-radius:2px}.battery i{display:block;background:var(--accent);height:100%;width:var(--level);border-radius:1px}.updated{font-size:12px;color:#75867d;margin-top:26px}
.visual{height:100%;min-height:0;display:grid;place-items:center;position:relative}.visual img{width:100%;height:100%;max-height:440px;object-fit:contain;filter:drop-shadow(0 23px 15px #264e3c26);animation:appear .4s ease;transform:none}.visual svg{width:100%;max-height:320px;filter:drop-shadow(0 23px 15px #264e3c26)}.visual-note{position:absolute;bottom:8%;font-size:11px;color:#7d8f85}
.device-nav{display:grid;grid-template-columns:32px minmax(0,1fr) 32px;align-items:center;gap:14px}.arrow{background:none;border:0;font:300 36px Arial}.arrow:disabled{opacity:.2;cursor:default}.strip{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:15px 4px 19px;scroll-snap-type:x mandatory}.tile{flex:0 0 calc((100% - 56px)/5);min-width:170px;border:1px solid #ffffffb0;background:linear-gradient(140deg,#ffffff85,#ffffff30);backdrop-filter:blur(25px);border-radius:22px;padding:18px 13px;position:relative;text-align:left;transition:transform .2s,box-shadow .2s;scroll-snap-align:start;display:flex;align-items:center;gap:12px;min-height:112px}.tile:hover{transform:translateY(-4px)}.tile[aria-pressed=true]{transform:translateY(-5px);box-shadow:0 15px 25px #366c5218}.tile[aria-pressed=true]:after{content:"";position:absolute;height:4px;width:64px;background:var(--accent);border-radius:6px;bottom:-12px;left:calc(50% - 32px)}.tile img{width:35px;height:35px;object-fit:contain;mix-blend-mode:multiply}.tile small{font-size:10px;color:#60776b;display:block;letter-spacing:.05em}.tile b{display:block;font-size:16px;margin:6px 0}.tile span{font-size:12px;color:#537b65}
footer{display:flex;justify-content:space-between;font-size:10px;color:#819087}.empty{font-size:24px}
dialog{border:1px solid white;border-radius:24px;padding:26px;background:#f2f7f5;color:#273c31;width:330px;box-shadow:0 25px 80px #22402d35}dialog::backdrop{background:#20392b33;backdrop-filter:blur(8px)}dialog h3{margin:0 0 18px}dialog label{display:flex;justify-content:space-between;padding:12px 0}dialog button{border:0;padding:9px 20px;background:#dcebe2;border-radius:12px;margin-top:14px}
@keyframes appear{from{opacity:0;translate:0 7px}to{opacity:1;translate:0 0}}
@media(max-width:1000px){.app{padding:18px 25px}.heading{min-height:105px}.filters button{padding:9px 13px}.hero{padding:0;grid-template-columns:58% 42%}.identity{gap:16px}.brand-logo{width:48px;height:48px}.metrics{gap:15px}.metric{padding-right:15px}.tile{flex-basis:calc((100% - 28px)/3)}}
@media(max-width:640px){.app{height:auto;min-height:100dvh}.heading{display:block;padding-top:25px}.filters{width:max-content;margin-top:18px}.hero{grid-template-columns:1fr;padding-top:25px}.visual{height:230px;grid-row:1}.visual img{max-height:260px}.brand-logo{width:40px;height:40px}.metrics{margin-top:22px}.tile{flex-basis:80%}.tools small{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
.visual{overflow:hidden}.visual .product{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);max-width:100%;max-height:none;object-fit:contain}.tile .thumb{width:50px;height:60px;object-fit:contain;mix-blend-mode:normal}.tile{min-width:185px}.tile b{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.metrics{flex-wrap:wrap}.info{min-width:0}.brand-logo{flex-shrink:0}.visual-note{bottom:0}footer{gap:20px}#scanStatus{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.product-switch{position:absolute;inset:0;border:0;padding:0;background:transparent;border-radius:18px}.product-switch:focus-visible{outline-offset:-4px}.visual-note{pointer-events:none}.logitech-visual .product{inset:17%;width:66%;height:66%}</style><link rel="stylesheet" href="showcase.css">
<div class="wallpaper" aria-hidden="true"></div><div class="ambient" aria-hidden="true"><i class="glass-orbit orbit-one"></i><i class="glass-orbit orbit-two"></i><i class="glass-ribbon"></i></div>
<main class="app">
<header class="top"><span class="wordmark">NEXUS</span><div class="tools"><small></small><button class="gear" id="settings" aria-label="外观设置">⚙</button></div></header>
<div class="heading"><h1>设备总览</h1><nav class="filters" aria-label="设备连接筛选"><button data-filter="on" aria-pressed="true">已连接设备</button><button data-filter="off" aria-pressed="false">未连接设备</button></nav></div>
<section class="hero" id="hero" aria-live="polite"></section>
<nav class="device-nav" aria-label="切换设备"><button class="arrow" id="prev" aria-label="上一台设备">‹</button><div class="strip" id="strip"></div><button class="arrow" id="next" aria-label="下一台设备">›</button></nav>
<footer><span id="scanStatus">正在读取设备…</span><span id="position"></span></footer>
</main>
<dialog id="preferences"><div class="preferences-heading"><div><small>PERSONALIZE</small><h3>外观与背景</h3></div><form method="dialog"><button class="close-preferences" aria-label="关闭">×</button></form></div><p class="preference-caption">选择一种氛围，让设备自然融入桌面。</p><div class="theme-grid"><label><span class="swatch mint"></span>薄荷绿<input type="radio" name="theme" value="mint" checked></label><label><span class="swatch night"></span>暗夜绿<input type="radio" name="theme" value="night"></label><label><span class="swatch purple"></span>极光紫<input type="radio" name="theme" value="purple"></label><label><span class="swatch glass"></span>曜石玻璃<input type="radio" name="theme" value="glass"></label></div><div class="wallpaper-setting"><label>自选壁纸<input type="radio" name="theme" value="wallpaper"></label><p>图片会保存在本机，配合深色遮罩保持文字清晰。</p><button type="button" id="chooseWallpaper">选择图片</button><p id="wallpaperStatus" role="status"></p></div><form method="dialog" class="settings-footer"><button>完成</button></form></dialog>
<script src="product-images.js"></script><script src="renderer.js"></script><script src="appearance.js"></script></html>
