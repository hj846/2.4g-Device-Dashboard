<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS · 多品牌设备中心 UI 预览</title>
  <style>
    :root {
      font-family: Inter, "PingFang SC", "Microsoft YaHei UI", "Noto Sans CJK SC", system-ui, sans-serif;
      color: #1c2a23;
      background: #eef1ef;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 760px; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible, .device:focus-visible { outline: 3px solid #22b873; outline-offset: 3px; }
    .ambient { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: -1; background: #eef1ef; }
    .ambient::before, .ambient::after { content: ""; position: absolute; border-radius: 50%; filter: blur(90px); }
    .ambient::before { width: 950px; height: 580px; left: -12%; bottom: -300px; background: #a8eac1; }
    .ambient::after { width: 800px; height: 560px; right: -14%; bottom: -220px; background: #a3d9d4; }
    .shell { width: min(1336px, calc(100% - 64px)); margin: auto; padding: 24px 0 58px; }
    .chrome, .nav, .chrome-right, .headline, .headline-actions, .section-head, .filters { display: flex; align-items: center; }
    .chrome { justify-content: space-between; height: 44px; }
    .nav, .chrome-right { gap: 9px; }
    .pill { border: 1px solid #ffffffaa; background: #ffffff75; color: #28352d; border-radius: 999px; height: 42px; padding: 0 17px; font-size: 13px; font-weight: 650; box-shadow: inset 0 1px #fff9; }
    .pill.active { background: #fff; box-shadow: 0 5px 18px #477c5d1e, inset 0 1px white; }
    .brand-pill { display: inline-flex; align-items: center; gap: 9px; }
    .brand-dot { width: 16px; height: 16px; border: 5px solid #203d2a; border-radius: 50%; }
    .icon-button { width: 42px; height: 42px; padding: 0; border-radius: 50%; border: 1px solid #ffffffaa; background: #ffffff79; font-size: 19px; color: #4f6255; }
    .icon-button:hover, .pill:hover { background: white; }
    .headline { justify-content: space-between; margin-top: 63px; gap: 24px; }
    .eyebrow { font-size: 12px; color: #43835d; font-weight: 750; letter-spacing: .12em; margin: 0 0 10px; }
    h1 { font-size: clamp(29px, 3vw, 39px); line-height: 1.1; letter-spacing: -.045em; margin: 0; font-weight: 750; }
    .intro { margin: 12px 0 0; font-size: 14px; color: #68786d; }
    .headline-actions { gap: 14px; }
    .sync { font-size: 12px; color: #718177; white-space: nowrap; }
    .sync::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #27be71; margin-right: 8px; vertical-align: 1px; }
    .primary { height: 44px; padding: 0 19px; border: none; border-radius: 999px; color: white; font-size: 13px; font-weight: 700; background: linear-gradient(135deg, #24ca78, #20b969); box-shadow: 0 9px 25px #22b96a4c; }
    .primary:hover { filter: brightness(1.06); }
    .overview { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; margin-top: 34px; }
    .summary { height: 122px; border-radius: 24px; padding: 22px 24px; background: #ffffff76; border: 1px solid #fff9; box-shadow: inset 0 1px white, 0 10px 30px #5b906a18; backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%); }
    .summary-label { color: #607167; font-size: 13px; font-weight: 600; }
    .summary-line { display: flex; align-items: baseline; gap: 11px; margin-top: 12px; }
    .summary-value { color: #159d5b; font-size: 31px; font-weight: 750; line-height: 1; letter-spacing: -.04em; }
    .summary-note { color: #819187; font-size: 12px; }
    .section-head { justify-content: space-between; gap: 20px; margin: 39px 0 18px; }
    .section-head h2 { margin: 0; font-size: 21px; letter-spacing: -.03em; }
    .count { color: #708277; font-size: 13px; font-weight: 500; margin-left: 10px; }
    .filters { gap: 5px; padding: 5px; background: #dfe8e180; border: 1px solid #ffffff8c; border-radius: 999px; }
    .filter { border: 0; background: transparent; color: #66776c; border-radius: 999px; min-width: 94px; height: 33px; padding: 0 12px; font-size: 12px; font-weight: 650; }
    .filter.active { background: white; color: #1e3628; box-shadow: 0 3px 12px #4e8b6124; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .device { position: relative; min-height: 246px; overflow: hidden; padding: 24px; border-radius: 28px; background: linear-gradient(135deg, #ffffffb0, #ffffff75 52%, #ffffff9e); border: 1px solid #fffdf4; box-shadow: 0 14px 38px #5d8d6c20, inset 0 1px #fff; backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); cursor: pointer; transition: transform .18s, box-shadow .18s; }
    .device::before { content: ""; position: absolute; inset: 0 0 auto; height: 52%; background: linear-gradient(145deg, #ffffff82, transparent 62%); pointer-events: none; }
    .device:hover { transform: translateY(-3px); box-shadow: 0 20px 44px #5d8d6c2e, inset 0 1px #fff; }
    .card-head { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 15px; align-items: center; min-height: 56px; }
    .logo { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 50%; background: #edf6ee; overflow: hidden; border: 1px solid #ffffffbf; }
    .logo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .logo.soft img { width: 44px; height: 44px; object-fit: contain; }
    .brand { font-size: 11px; font-weight: 750; color: #568265; letter-spacing: .08em; line-height: 1.2; }
    .device-name { margin: 6px 0 0; font-size: 18px; font-weight: 750; line-height: 1.25; letter-spacing: -.025em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status { display: flex; align-items: center; gap: 6px; align-self: start; padding: 6px 0; font-size: 12px; font-weight: 700; color: #188c54; white-space: nowrap; }
    .status::before { content: ""; width: 7px; height: 7px; background: currentColor; border-radius: 50%; }
    .status.warn { color: #ba852e; }.status.off { color: #c26b70; }
    .divider { height: 1px; background: linear-gradient(90deg, #8da89737, #8da89716); margin: 22px 0 19px; }
    .metrics { display: grid; grid-template-columns: 1fr 1fr 1.23fr; gap: 15px; align-items: start; }
    .metric-label { color: #7a8b7f; font-size: 11px; font-weight: 650; margin-bottom: 10px; }
    .metric-value { display: flex; align-items: center; gap: 9px; min-height: 27px; font-size: 14px; font-weight: 700; white-space: nowrap; }
    .battery { width: 31px; height: 15px; border: 1.8px solid #83a18c; border-radius: 4px; padding: 2px; position: relative; flex: none; }
    .battery::after { content: ""; position: absolute; right: -4px; top: 4px; width: 2px; height: 5px; border-radius: 0 2px 2px 0; background: #83a18c; }
    .battery-fill { display: block; width: var(--level); height: 100%; border-radius: 2px; background: #23bd70; }
    .battery.low .battery-fill { background: #d9a33e; }.battery.depleted .battery-fill { background: #d77d83; }
    .dots { display: flex; align-items: center; gap: 5px; height: 15px; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: #d7e1d9; }
    .dots i.on { background: #22b96e; }.dots.weak i.on { background: #d9a33e; }
    .connection { overflow: hidden; text-overflow: ellipsis; }
    .card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; color: #839488; font-size: 11px; }
    .open { color: #21945b; font-weight: 750; font-size: 12px; }
    .empty { grid-column: 1 / -1; border: 1px solid white; border-radius: 28px; background: #ffffff9e; text-align: center; padding: 66px 25px; color: #66776b; }
    .footnote { margin-top: 24px; color: #718477; font-size: 11px; }
    .overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px; background: #1731218f; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .overlay[hidden] { display: none; }
    .detail { width: min(590px, 100%); border-radius: 30px; border: 1px solid #fff; padding: 28px; background: #f8fcf9df; box-shadow: 0 30px 90px #16392455; backdrop-filter: blur(32px); }
    .detail-top { display: flex; align-items: start; justify-content: space-between; }
    .detail-top h2 { margin: 6px 0 0; font-size: 23px; }.detail-top p { margin: 9px 0 0; color: #6c7b70; font-size: 13px; }
    .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 29px; }
    .detail-cell { border-radius: 17px; padding: 15px; background: #e8f0e9; }.detail-cell small { display: block; color: #718477; font-size: 11px; }.detail-cell strong { display: block; margin-top: 9px; font-size: 16px; }
    .detail-section { margin-top: 26px; border-top: 1px solid #dfe9e1; padding-top: 23px; }.detail-section h3 { margin: 0; font-size: 16px; }.detail-section p { margin: 8px 0 15px; color: #6c7b70; font-size: 12px; }
    .dpi-list { display: flex; gap: 9px; flex-wrap: wrap; }.dpi-list button { border: 0; border-radius: 14px; padding: 10px 17px; background: #e2ebe4; color: #314936; font-weight: 700; font-size: 13px; }.dpi-list button.active { color: white; background: #22bd70; }.dpi-list button:disabled { opacity: .45; cursor: not-allowed; }
    .toast { position: fixed; right: 26px; bottom: 25px; z-index: 20; border-radius: 14px; padding: 12px 18px; color: white; background: #235c3c; box-shadow: 0 12px 30px #1a40275e; font-size: 13px; }.toast[hidden] { display: none; }
    @media (max-width: 980px) { .shell { width: calc(100% - 40px); }.grid { grid-template-columns: 1fr; }.headline { margin-top: 42px; }.overview { gap: 9px; } }
  </style>
</head>

    const scenes = ['混合状态', '全部在线', '全部断开', '无设备'];
    const $ = id => document.getElementById(id);
    let devices = seeds.map(d => ({ ...d })), scene = 0, filter = '全部设备', current = null;
    function notify(text) { $('toast').textContent = text; $('toast').hidden = false; clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => $('toast').hidden = true, 2400); }
    function dots(n) { return `<span class="dots ${n > 0 && n < 3 ? 'weak' : ''}" aria-label="信号 ${n} 格">${[0,1,2,3].map(i => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>`; }
    function signalLabel(n) { return ['无信号', '很弱', '偏弱', '良好', '强'][n]; }
    function card(d) { const kind = d.battery === 0 ? 'depleted' : d.battery < 25 ? 'low' : ''; const state = d.status === '已断开' ? 'off' : d.status === '需要关注' ? 'warn' : ''; return `<article class="device" data-id="${d.id}" tabindex="0" role="button" aria-label="查看 ${d.name} 设备详情"><div class="card-head"><div class="logo ${d.icon === 'STEELSERIES' || d.icon === 'RAZER' ? 'soft' : ''}"><img src="${icons[d.icon]}" alt="${d.brand} 标识"></div><div><div class="brand">${d.brand}</div><div class="device-name">${d.name}</div></div><div class="status ${state}">${d.status}</div></div><div class="divider"></div><div class="metrics"><div><div class="metric-label">电量</div><div class="metric-value"><span class="battery ${kind}" style="--level:${d.battery}%"><span class="battery-fill"></span></span>${d.status === '已断开' ? '未知' : `${d.battery}%`}</div></div><div><div class="metric-label">信号</div><div class="metric-value">${dots(d.signal)}<span>${signalLabel(d.signal)}</span></div></div><div><div class="metric-label">连接方式</div><div class="metric-value connection" title="${d.link}">${d.link}</div></div></div><div class="card-foot"><span>最近同步 · ${d.time}</span><span class="open">查看详情 ↗</span></div></article>`; }
    function render() {
      $('overview').innerHTML = `<div class="summary"><div class="summary-label">在线设备</div><div class="summary-line"><span class="summary-value">${devices.filter(d => d.status !== '已断开').length} / ${devices.length}</span><span class="summary-note">跨品牌统一显示</span></div></div><div class="summary"><div class="summary-label">需要关注</div><div class="summary-line"><span class="summary-value">${devices.filter(d => d.status === '需要关注').length}</span><span class="summary-note">电量或信号偏低</span></div></div><div class="summary"><div class="summary-label">当前场景</div><div class="summary-line"><span class="summary-value" style="font-size:25px">${scenes[scene]}</span><span class="summary-note">演示模式</span></div></div>`;
      $('filters').innerHTML = ['全部设备', '需要关注', '已断开'].map(name => `<button class="filter ${filter === name ? 'active' : ''}" data-filter="${name}">${name}</button>`).join('');
      $('filters').querySelectorAll('button').forEach(button => button.onclick = () => { filter = button.dataset.filter; render(); });
      const shown = devices.filter(d => filter === '全部设备' || d.status === filter);
      $('count').textContent = `${shown.length} 台`;
      $('deviceGrid').innerHTML = shown.length ? shown.map(card).join('') : `<div class="empty"><strong>${devices.length ? '当前筛选下没有设备' : '尚未发现设备'}</strong><p>切换演示场景可预览其他状态</p></div>`;
      $('deviceGrid').querySelectorAll('.device').forEach(el => { el.onclick = () => openDetail(el.dataset.id); el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(el.dataset.id); } }; });
    }
    function openDetail(id) {
      const d = devices.find(item => item.id === id); if (!d) return; current = id;
      $('detailBrand').textContent = d.brand; $('detailTitle').textContent = d.name; $('detailSubtitle').textContent = `${d.kind} · ${d.status}`;
      $('detailGrid').innerHTML = [['电量', d.status === '已断开' ? '未知' : `${d.battery}%`], ['信号', signalLabel(d.signal)], ['连接', d.link]].map(([name, value]) => `<div class="detail-cell"><small>${name}</small><strong>${value}</strong></div>`).join('');
      $('detailSection').innerHTML = d.kind === '鼠标' ? `<h3>DPI 档位</h3><p>${d.status === '已断开' ? '设备已断开，当前无法切换。' : '点击档位预览设置效果；仅在此页面模拟。'}</p><div class="dpi-list">${[800, 1200, 1600, 2400].map(value => `<button data-dpi="${value}" ${d.status === '已断开' ? 'disabled' : ''} class="${d.dpi === value ? 'active' : ''}">${value} DPI</button>`).join('')}</div>` : '<h3>设备设置</h3><p>后续可在此处加入该设备的专属调整项。</p>';
      $('detailSection').querySelectorAll('[data-dpi]').forEach(button => button.onclick = () => { d.dpi = Number(button.dataset.dpi); openDetail(id); notify(`已选择 ${d.dpi} DPI · 界面演示`); });
      $('overlay').hidden = false; $('closeButton').focus();
    }
    $('closeButton').onclick = () => $('overlay').hidden = true;
    $('overlay').onclick = e => { if (e.target === $('overlay')) $('overlay').hidden = true; };
    document.onkeydown = e => { if (e.key === 'Escape') $('overlay').hidden = true; };
    $('scenarioButton').onclick = () => { scene = (scene + 1) % scenes.length; devices = seeds.map(d => ({ ...d })); if (scene === 1) devices.forEach(d => { d.status = '已连接'; d.signal = 4; d.battery = Math.max(70, d.battery); d.link = '2.4G 接收器'; }); if (scene === 2) devices.forEach(d => { d.status = '已断开'; d.signal = 0; d.battery = 0; d.link = '等待连接'; }); if (scene === 3) devices = []; filter = '全部设备'; $('overlay').hidden = true; render(); };
    document.querySelectorAll('.icon-button, .brand-pill').forEach(button => { if (!button.id) button.onclick = () => notify('此处为 UI 预览，功能将在后续加入'); });
    render();
  </script>
